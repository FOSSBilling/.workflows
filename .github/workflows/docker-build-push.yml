name: Build and Push to Docker Hub

on:
  workflow_call:
    inputs:
      download-artifact:
        description: >
          'The name of a build artifact containing the files required to build the image(s).
          The download should contain a single .tar archive named build.tar.'
        default: ''
        required: false
        type: string
      platforms:
        description: 'The platform(s) to build and push images for (as JSON string array).'
        default: '["linux/amd64"]'
        required: false
        type: string
      repository-name:
        description: 'The repository to push images to (e.g. namespace/repo-name).'
        default: ${{ github.repository }}
        required: false
        type: string
      tag-latest:
        description: 'Whether to tag the builds with the latest tag or not.'
        default: 'false'
        required: false
        type: string
      tag-raw:
        description: 'The raw tag name to tag the builds with, if any.'
        default: ''
        required: false
        type: string
    secrets:
      dockerhub-username:
        description: 'The username used to authenticate with Docker Hub.'
        required: true
      dockerhub-token:
        description: 'The personal access token used to authenticate with Docker Hub.'
        required: true

jobs:
  build:
    name: 'Build and Push Image (${{ matrix.platform }})'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - name: 'Docker Meta'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ inputs.repository-name }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ inputs.tag-latest == 'true' }}
            type=raw,value=${{ inputs.tag-raw }},enable=${{ inputs.tag-raw != '' }}
      - name: 'Set up QEMU'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 'Login to Docker Hub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}

      - name: 'Checkout Dockerfile'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: |
            Dockerfile
          sparse-checkout-cone-mode: false

      - name: 'Download Files Required for Build'
        if: ${{ inputs.download-artifact != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ inputs.download-artifact }}
          path: '/tmp/'

      - name: 'Extract Files Required for Build'
        if: ${{ inputs.download-artifact != '' }}
        run: |
          mkdir ./src
          tar -xvf /tmp/build.tar -C ./src
      - name: 'Build and Push by Digest'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          # cache-from intentionally omitted because missing remote blobs in GHA cache
          # can hard-fail buildx during restore (BlobNotFound) on main/release runs.
          cache-to: type=gha,scope=${{ github.ref_name }}-${{ matrix.platform }},ignore-error=true
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ inputs.repository-name }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}

      - name: 'Export Digest'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: 'Check if Digests Artifact Exists and Merge'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: owner,
              repo: repo,
              run_id: context.runId,
              name: 'digests'
            });
            if (artifacts.data.total_count > 0) {
              console.log('Digests artifact already uploaded - retrieving.');
              const digests = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: artifacts.data.artifacts[0].id,
                archive_format: 'zip'
              });
              const { writeFileSync } = await import('node:fs');
              const { execSync } = await import('node:child_process');
              writeFileSync('/tmp/digests.zip', Buffer.from(digests.data));
              execSync(`unzip -o /tmp/digests.zip -d /tmp/digests`);
              console.log('Deleting already uploaded digests artifact.');
              const result = await github.rest.actions.deleteArtifact({
                owner: owner,
                repo: repo,
                artifact_id: artifacts.data.artifacts[0].id
              });
              if (result.status === 204) {
                return;
              } else {
                core.setFailed(`Failed to delete existing digests artifact (status: ${result.status})`);
              }
            } else {
              return;
            }
      - name: 'Upload Digests'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: digests
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  push:
    name: 'Merge Builds and Push Manifest'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 'Download Digests'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: digests
          path: /tmp/digests

      - name: 'Set up Docker Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: 'Docker Meta'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ inputs.repository-name }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ inputs.tag-latest == 'true' }}
            type=raw,value=${{ inputs.tag-raw }},enable=${{ inputs.tag-raw != '' }}
      - name: 'Login to Docker Hub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.dockerhub-username }}
          password: ${{ secrets.dockerhub-token }}

      - name: 'Create Manifest List and Push'
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ inputs.repository-name }}@sha256:%s ' *)
        working-directory: /tmp/digests

      - name: 'Inspect Image'
        run: |
          docker buildx imagetools inspect ${{ inputs.repository-name }}:${{ steps.meta.outputs.version }}